name: Build single-file releases

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install -r requirements.txt
      - run: python -m unittest discover -s . -p "test_*.py"

  build:
    needs: test
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: windows-latest
            artifact: ResearchSentinel-windows-x86_64
            executable: dist/ResearchSentinel.exe
          - runner: ubuntu-22.04
            artifact: ResearchSentinel-linux-x86_64
            executable: dist/ResearchSentinel
          - runner: macos-15-intel
            artifact: ResearchSentinel-macos-x86_64
            executable: dist/ResearchSentinel
          - runner: macos-15
            artifact: ResearchSentinel-macos-arm64
            executable: dist/ResearchSentinel
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install -r requirements-build.txt
      - run: python -m PyInstaller --noconfirm --clean ResearchSentinel.spec
      - name: Smoke test
        shell: bash
        run: '"${{ matrix.executable }}" --help'
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: ${{ matrix.executable }}
          if-no-files-found: error

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: release-assets
      - run: |
          mkdir assets
          for dir in release-assets/*; do
            name=$(basename "$dir")
            file=$(find "$dir" -maxdepth 1 -type f | head -n 1)
            case "$file" in *.exe) extension=.exe ;; *) extension= ;; esac
            cp "$file" "assets/${name}${extension}"
          done
      - uses: softprops/action-gh-release@v2
        with:
          files: assets/*
